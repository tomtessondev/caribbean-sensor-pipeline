# The whole pipeline on a laptop: broker, database, migrations, ingestor, stations (six
# simulated ones, or the real ones through the bridge) and Grafana.
# `make up` (or `docker compose --profile simulated up`) runs the simulator,
# `make up STATION_SOURCE=meteofrance` the bridge with Météo-France's weather stations,
# `make up STATION_SOURCE=real` the bridge with those and the official air-quality stations
# (the deployed stack).
# Grafana on http://localhost:3001 (admin / admin), stations endpoint on
# http://localhost:8010/v1/stations, database on localhost:5433, broker on localhost:8883
# (TLS, login required; the CA is in the broker-secrets volume).

x-app: &app
  build: .
  image: caribbean-sensor-pipeline
  environment:
    MQTT_HOST: broker
    MQTT_PORT: "8883"
    MQTT_TLS_CA: /broker/ca.crt
    MQTT_CREDENTIALS_FILE: /broker/credentials.json
    SENSOR_DB_DSN: postgresql://sensors:sensors@db:5432/sensors
    # simulated (the six simulated stations), meteofrance (the weather stations of
    # src/sensor_pipeline/data/meteofrance_antilles.csv) or real (those and the
    # air-quality stations of data/air_quality_antilles.csv): what migrate registers and what
    # provision creates broker logins for.
    STATION_SOURCE: ${STATION_SOURCE:-simulated}
    GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-local}
    INGESTOR_DB_PASSWORD: ${INGESTOR_DB_PASSWORD:-ingestor-local}
    SITE_DB_PASSWORD: ${SITE_DB_PASSWORD:-site-local}
  volumes:
    - broker-secrets:/broker:ro

services:
  # Generates the CA, the broker certificate, one password per station and the ACL on the
  # first start; later starts keep them.
  provision:
    <<: *app
    command: ["provision-broker", "--out", "/broker"]
    volumes:
      - broker-secrets:/broker

  broker:
    image: eclipse-mosquitto:2.0.22
    entrypoint: ["/bin/sh", "/docker/broker-entrypoint.sh"]
    ports:
      - "8883:8883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/broker-entrypoint.sh:/docker/broker-entrypoint.sh:ro
      - broker-secrets:/broker:ro
      - broker-data:/mosquitto/data
    depends_on:
      provision:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: timescale/timescaledb:2.22.1-pg17
    environment:
      POSTGRES_USER: sensors
      POSTGRES_PASSWORD: sensors
      POSTGRES_DB: sensors
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensors -d sensors"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy

  ingest:
    <<: *app
    command: ["ingest", "--ready-file", "/tmp/ingest-ready"]
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "8883"
      MQTT_TLS_CA: /broker/ca.crt
      MQTT_USERNAME: ingestor
      MQTT_CREDENTIALS_FILE: /broker/credentials.json
      # Insert-only database role (migration 004), not the owner.
      SENSOR_DB_DSN: postgresql://sensor_ingestor:${INGESTOR_DB_PASSWORD:-ingestor-local}@db:5432/sensors
    depends_on:
      broker:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ingest-ready"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  simulator:
    <<: *app
    command: ["simulate", "--backfill-hours", "48", "--interval", "10"]
    profiles: ["simulated"]
    depends_on:
      ingest:
        condition: service_healthy
    restart: unless-stopped

  # Real stations instead of the simulator: `make up STATION_SOURCE=meteofrance` or
  # `make up STATION_SOURCE=real`. Needs the Météo-France application id in
  # secrets/meteofrance_application_id (never committed).
  bridge:
    <<: *app
    command: ["bridge"]
    profiles: ["meteofrance", "real"]
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "8883"
      MQTT_TLS_CA: /broker/ca.crt
      MQTT_CREDENTIALS_FILE: /broker/credentials.json
      METEOFRANCE_APPLICATION_ID_FILE: /run/secrets/meteofrance_application_id
      STATION_SOURCE: ${STATION_SOURCE:-meteofrance}
    volumes:
      - broker-secrets:/broker:ro
      - ./secrets/meteofrance_application_id:/run/secrets/meteofrance_application_id:ro
    depends_on:
      ingest:
        condition: service_healthy
    # Lets the tick in progress (a download of a few seconds, the wait for acks) end on
    # `docker stop` instead of Docker's 10 s. A stuck one is killed: what was not
    # acknowledged is sent again after the restart, and ingestion ignores duplicates.
    stop_grace_period: 30s
    restart: unless-stopped

  # The latest reading of each station for the portfolio site's map, on
  # http://localhost:8010/v1/stations. Reads one view as site_reader (migration 006).
  api:
    <<: *app
    command: ["api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SENSOR_DB_DSN: postgresql://site_reader:${SITE_DB_PASSWORD:-site-local}@db:5432/sensors
    volumes: []
    ports:
      - "8010:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-local}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Local demo: dashboards readable without logging in; editing still needs admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/air-quality.json
    ports:
      # 3000 is often taken by a JavaScript dev server.
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  broker-secrets:
  broker-data:
  db-data:
  grafana-data:
