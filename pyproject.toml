[project]
name = "caribbean-sensor-pipeline"
version = "0.1.0"
description = "IoT pipeline: air-quality sensor stations in the French Antilles, MQTT, TimescaleDB, Grafana"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tom Tesson" }]
dependencies = [
    "paho-mqtt>=2.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # Integration tests run a real Mosquitto and TimescaleDB in Docker.
    "testcontainers>=4.8",
    # Tests read the Grafana provisioning files.
    "pyyaml>=6.0",
]
# Builds and tests the ESP32 firmware in firmware/.
firmware = [
    "platformio>=6.1",
]

[project.scripts]
sensor-pipeline = "sensor_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensor_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sensor_pipeline --cov-report=term-missing"
markers = ["integration: needs Docker (real Mosquitto and TimescaleDB)"]
