; Firmware for one air-quality station: ESP32 + BME280 (I2C) + PMS5003 (UART).
;
;   pio test -e native     logic tests on the host (no board needed)
;   pio run -e esp32dev    build the firmware
;   pio run -e esp32dev -t upload -t monitor

[platformio]
default_envs = esp32dev

[env]
lib_deps =
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11

[env:esp32dev]
; Arduino core 2.0.x on ESP-IDF 4.4, whose esp-mqtt client does QoS 1, last will and
; retransmission on its own.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BME280 Library@2.2.4
    adafruit/Adafruit Unified Sensor@1.1.15
test_ignore = *

[env:native]
platform = native
; The golden message the Python ingestor also validates (tests/test_firmware_contract.py).
build_flags =
    ${env.build_flags}
    '-D GOLDEN_TELEMETRY_PATH="$PROJECT_DIR/test/golden/telemetry_v1.json"'
