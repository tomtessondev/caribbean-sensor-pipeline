# Broker for docker-compose.yml: TLS only, a login for every client, per-station ACL.
# The certificates, passwords and ACL come from `sensor-pipeline provision-broker`;
# docker/broker-entrypoint.sh installs them before starting Mosquitto.

listener 8883
cafile /mosquitto/secure/ca.crt
certfile /mosquitto/secure/server.crt
keyfile /mosquitto/secure/server.key
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/secure/passwd
acl_file /mosquitto/secure/acl

# Persistent sessions and retained statuses survive a broker restart.
persistence true
persistence_location /mosquitto/data/

# Queue for a disconnected persistent client (the ingestor during a redeploy).
max_queued_messages 100000
