apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescale
    type: grafana-postgresql-datasource
    url: db:5432
    # Read-only role created by migration 002; its password comes from the environment.
    user: grafana_reader
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: sensors
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true
    isDefault: true
    editable: false
